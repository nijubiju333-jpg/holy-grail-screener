<!DOCTYPE html>
<html>
<head>
    <title>HOLY GRAIL Screener</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background: white; padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin: 0 0 10px 0; }
        .btn { background: #27ae60; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin: 20px 0; transition: 0.3s; }
        .btn:hover { background: #219150; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 14px; }
        .card p { font-size: 32px; font-weight: bold; color: #667eea; margin: 10px 0; }
        .section { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #34495e; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .empty { text-align: center; color: #7f8c8d; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 HOLY GRAIL SCREENER</h1>
            <p>Advanced NSE Stock Filter</p>
            <button class="btn" onclick="runScan()">⚡ RUN SCAN NOW</button>
            <p id="status" style="color: #e74c3c; font-weight: bold;"></p>
        </div>

        <div class="stats">
            <div class="card"><h3>TODAY'S FINDS</h3><p id="todayCount">-</p></div>
            <div class="card"><h3>TOTAL HISTORY</h3><p id="totalCount">-</p></div>
            <div class="card"><h3>LAST SCAN</h3><p id="lastScan">-</p></div>
        </div>

        <div class="section">
            <h2>📊 Today's Results</h2>
            <div id="todayTable"></div>
        </div>

        <div class="section">
            <h2>📜 Past History</h2>
            <div id="historyTable"></div>
        </div>
    </div>

    <script>
        function runScan() {
            document.getElementById('status').innerText = "Scanning 50 stocks... Please wait 2 minutes.";
            fetch('/run_scan', {method: 'POST'}).then(r => r.json()).then(d => {
                document.getElementById('status').innerText = d.status;
                setTimeout(() => location.reload(), 120000); // Auto refresh in 2 mins
            });
        }

        fetch('/api/data').then(r => r.json()).then(data => {
            document.getElementById('todayCount').innerText = data.today_count;
            document.getElementById('totalCount').innerText = data.history.length;
            document.getElementById('lastScan').innerText = data.history.length > 0 ? data.history[0].scan_date : 'None';

            let tHtml = data.today_results.length ? '<table><tr><th>Stock</th><th>Price</th><th>RSI</th><th>Time</th></tr>' : '<div class="empty">No stocks found today yet. Click Run Scan!</div>';
            data.today_results.forEach(s => { tHtml += `<tr><td><b>${s.stock_symbol}</b></td><td>₹${s.stock_price}</td><td>${s.daily_rsi}</td><td>${s.scan_time.split(' ')[1]}</td></tr>`; });
            if(data.today_results.length) tHtml += '</table>';
            document.getElementById('todayTable').innerHTML = tHtml;

            let hHtml = data.history.length ? '<table><tr><th>Date</th><th>Stocks Found</th></tr>' : '<div class="empty">No history yet.</div>';
            data.history.forEach(h => { hHtml += `<tr><td>${h.scan_date}</td><td>${h.count}</td></tr>`; });
            if(data.history.length) hHtml += '</table>';
            document.getElementById('historyTable').innerHTML = hHtml;
        });
    </script>
</body>
</html>
